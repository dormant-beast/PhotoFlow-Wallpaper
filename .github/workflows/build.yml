name: Build PhotoFlow Wallpaper

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'
          api-level: 35
          build-tools: '35.0.0'

      - name: Generate complete Android project
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          APP="$ROOT/app"
          mkdir -p "$APP/src/main/java/com/photoflow/wallpaper"
          mkdir -p "$APP/src/main/res/layout"
          mkdir -p "$APP/src/main/res/xml"
          mkdir -p "$APP/src/main/res/values"
          mkdir -p "$APP/src/main/res/drawable"
          mkdir -p "$APP/src/main/res/mipmap-anydpi-v26"

          # ========== settings.gradle.kts ==========
          cat > "$ROOT/settings.gradle.kts" << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PhotoFlowWallpaper"
          include(":app")
          EOF

          # ========== build.gradle.kts (root) ==========
          cat > "$ROOT/build.gradle.kts" << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # ========== gradle.properties ==========
          cat > "$ROOT/gradle.properties" << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # ========== app/build.gradle.kts ==========
          cat > "$APP/build.gradle.kts" << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.photoflow.wallpaper"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.photoflow.wallpaper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
          }
          EOF

          # ========== AndroidManifest.xml ==========
          cat > "$APP/src/main/AndroidManifest.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="PhotoFlow Wallpaper"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.PhotoFlow">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".PhotoWidgetProvider"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.photoflow.wallpaper.ACTION_NEXT_IMAGE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/photo_widget_info" />
                  </receiver>

                  <service
                      android:name=".PhotoLiveWallpaperService"
                      android:exported="true"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>

                  <service
                      android:name=".VideoLiveWallpaperService"
                      android:exported="true"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper_video" />
                  </service>

              </application>
          </manifest>
          EOF

          # ========== xml/photo_widget_info.xml ==========
          cat > "$APP/src/main/res/xml/photo_widget_info.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="110dp"
              android:minResizeWidth="110dp"
              android:minResizeHeight="110dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:maxResizeWidth="500dp"
              android:maxResizeHeight="500dp"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget_photo"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          # ========== xml/wallpaper.xml ==========
          cat > "$APP/src/main/res/xml/wallpaper.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_desc"
              android:thumbnail="@drawable/ic_launcher_foreground" />
          EOF

          # ========== xml/wallpaper_video.xml ==========
          cat > "$APP/src/main/res/xml/wallpaper_video.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_video_desc"
              android:thumbnail="@drawable/ic_launcher_foreground" />
          EOF

          # ========== layout/activity_main.xml ==========
          cat > "$APP/src/main/res/layout/activity_main.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212"
              android:padding="20dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="PhotoFlow Wallpaper"
                      android:textColor="#FFFFFF"
                      android:textSize="26sp"
                      android:textStyle="bold" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnPickPhotos"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="24dp"
                      android:text="Select Photos (Widget/Live)"
                      android:textAllCaps="false" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnPickVideo"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="Select Video (Video Live)"
                      android:textAllCaps="false" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="24dp"
                      android:text="Widget Timer Settings"
                      android:textColor="#80CBC4"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <Spinner
                      android:id="@+id/spinnerInterval"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginTop="8dp"
                      android:background="#1E1E1E"
                      android:padding="10dp" />

                  <LinearLayout
                      android:id="@+id/customTimeLayout"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:orientation="horizontal"
                      android:visibility="gone"
                      android:weightSum="3">

                      <EditText
                          android:id="@+id/etHours"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:hint="Hrs"
                          android:inputType="number"
                          android:textColor="#FFFFFF"
                          android:textColorHint="#888888" />

                      <EditText
                          android:id="@+id/etMinutes"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:hint="Min"
                          android:inputType="number"
                          android:textColor="#FFFFFF"
                          android:textColorHint="#888888" />

                      <EditText
                          android:id="@+id/etSeconds"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:hint="Sec"
                          android:inputType="number"
                          android:textColor="#FFFFFF"
                          android:textColorHint="#888888" />
                  </LinearLayout>

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnSaveTimer"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="Save Timer &amp; Update Widget"
                      android:textAllCaps="false"
                      android:backgroundTint="#4DB6AC" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnSetPhotoWallpaper"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="24dp"
                      android:text="Set Photo Live Wallpaper"
                      android:textAllCaps="false" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnSetVideoWallpaper"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="Set Video Live Wallpaper"
                      android:textAllCaps="false" />

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:text="Ready"
                      android:textColor="#80CBC4"
                      android:textSize="13sp" />
              </LinearLayout>
          </ScrollView>
          EOF

          # ========== layout/widget_photo.xml ==========
          cat > "$APP/src/main/res/layout/widget_photo.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widgetRoot"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg">

              <ImageView
                  android:id="@+id/widgetImage"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="centerCrop" />

              <TextView
                  android:id="@+id/widgetEmpty"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:text="Add Photos"
                  android:textColor="#888888"
                  android:textSize="14sp" />
          </FrameLayout>
          EOF

          # ========== drawable/widget_bg.xml ==========
          cat > "$APP/src/main/res/drawable/widget_bg.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#1E1E1E" />
              <corners android:radius="16dp" />
              <stroke android:width="2dp" android:color="#4DB6AC" />
          </shape>
          EOF

          # ========== values/strings.xml ==========
          cat > "$APP/src/main/res/values/strings.xml" << 'EOF'
          <resources>
              <string name="app_name">PhotoFlow Wallpaper</string>
              <string name="wallpaper_desc">Photo Flow Live Wallpaper</string>
              <string name="wallpaper_video_desc">Video Live Wallpaper</string>
          </resources>
          EOF

          # ========== values/themes.xml ==========
          cat > "$APP/src/main/res/values/themes.xml" << 'EOF'
          <resources>
              <style name="Theme.PhotoFlow" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#80CBC4</item>
                  <item name="colorPrimaryVariant">#4DB6AC</item>
                  <item name="colorOnPrimary">#000000</item>
                  <item name="android:statusBarColor">#121212</item>
                  <item name="android:navigationBarColor">#121212</item>
                  <item name="android:windowBackground">#121212</item>
              </style>
          </resources>
          EOF

          # ========== drawable/ic_launcher_foreground.xml ==========
          cat > "$APP/src/main/res/drawable/ic_launcher_foreground.xml" << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#80CBC4"
                  android:pathData="M54,30 C40,30 30,40 30,54 C30,68 40,78 54,78 C68,78 78,68 78,54 C78,40 68,30 54,30 Z M54,44 C59.5,44 64,48.5 64,54 C64,59.5 59.5,64 54,64 C48.5,64 44,59.5 44,54 C44,48.5 48.5,44 54,44 Z" />
          </vector>
          EOF

          # ========== mipmap-anydpi-v26/ic_launcher.xml ==========
          cat > "$APP/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # ========== values/colors.xml ==========
          cat > "$APP/src/main/res/values/colors.xml" << 'EOF'
          <resources>
              <color name="ic_launcher_background">#121212</color>
          </resources>
          EOF

          # ========== MainActivity.kt ==========
          cat > "$APP/src/main/java/com/photoflow/wallpaper/MainActivity.kt" << 'EOF'
          package com.photoflow.wallpaper

          import android.app.WallpaperManager
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.button.MaterialButton

          class MainActivity : AppCompatActivity() {
              private lateinit var tvStatus: TextView
              private lateinit var spinnerInterval: Spinner
              private lateinit var customTimeLayout: LinearLayout
              private lateinit var etHours: Edit
