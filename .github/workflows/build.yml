name: Build PhotoFlow Wallpaper

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'
          api-level: 35
          build-tools: '35.0.0'

      - name: Generate complete Android project
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          APP="$ROOT/app"
          mkdir -p "$APP/src/main/java/com/photoflow/wallpaper"
          mkdir -p "$APP/src/main/res/layout"
          mkdir -p "$APP/src/main/res/xml"
          mkdir -p "$APP/src/main/res/values"
          mkdir -p "$APP/src/main/res/drawable"
          mkdir -p "$APP/src/main/res/mipmap-anydpi-v26"

          # ========== settings.gradle.kts ==========
          cat > "$ROOT/settings.gradle.kts" << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PhotoFlowWallpaper"
          include(":app")
          EOF

          # ========== build.gradle.kts (root) ==========
          cat > "$ROOT/build.gradle.kts" << 'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          # ========== gradle.properties ==========
          cat > "$ROOT/gradle.properties" << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # ========== app/build.gradle.kts ==========
          cat > "$APP/build.gradle.kts" << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.photoflow.wallpaper"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.photoflow.wallpaper"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.constraintlayout:constraintlayout:2.2.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-ui:1.5.1")
          }
          EOF

          # ========== AndroidManifest.xml ==========
          cat > "$APP/src/main/AndroidManifest.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="PhotoFlow Wallpaper"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.PhotoFlow">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".PhotoWidgetProvider"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.photoflow.wallpaper.ACTION_NEXT_IMAGE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/photo_widget_info" />
                  </receiver>

                  <service
                      android:name=".PhotoLiveWallpaperService"
                      android:exported="true"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>

                  <service
                      android:name=".VideoLiveWallpaperService"
                      android:exported="true"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper_video" />
                  </service>

              </application>
          </manifest>
          EOF

          # ========== xml/photo_widget_info.xml ==========
          cat > "$APP/src/main/res/xml/photo_widget_info.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="110dp"
              android:minResizeWidth="110dp"
              android:minResizeHeight="110dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:maxResizeWidth="500dp"
              android:maxResizeHeight="500dp"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget_photo"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          # ========== xml/wallpaper.xml ==========
          cat > "$APP/src/main/res/xml/wallpaper.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_desc"
              android:thumbnail="@drawable/ic_launcher_foreground" />
          EOF

          # ========== xml/wallpaper_video.xml ==========
          cat > "$APP/src/main/res/xml/wallpaper_video.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_video_desc"
              android:thumbnail="@drawable/ic_launcher_foreground" />
          EOF

          # ========== layout/activity_main.xml ==========
          cat > "$APP/src/main/res/layout/activity_main.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212"
              android:padding="20dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="PhotoFlow Wallpaper"
                      android:textColor="#FFFFFF"
                      android:textSize="26sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="Photo &amp; Video Live Wallpaper"
                      android:textColor="#AAAAAA"
                      android:textSize="14sp" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnPickPhotos"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="24dp"
                      android:text="Select Photos (Widget/Live)"
                      android:textAllCaps="false" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnPickVideo"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="Select Video (Video Live)"
                      android:textAllCaps="false" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="24dp"
                      android:text="Widget Timer Settings"
                      android:textColor="#80CBC4"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <Spinner
                      android:id="@+id/spinnerInterval"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginTop="8dp"
                      android:background="#1E1E1E"
                      android:padding="10dp" />

                  <LinearLayout
                      android:id="@+id/customTimeLayout"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:orientation="horizontal"
                      android:visibility="gone"
                      android:weightSum="3">

                      <EditText
                          android:id="@+id/etHours"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:hint="Hrs"
                          android:inputType="number"
                          android:textColor="#FFFFFF"
                          android:textColorHint="#888888" />

                      <EditText
                          android:id="@+id/etMinutes"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:hint="Min"
                          android:inputType="number"
                          android:textColor="#FFFFFF"
                          android:textColorHint="#888888" />

                      <EditText
                          android:id="@+id/etSeconds"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:hint="Sec"
                          android:inputType="number"
                          android:textColor="#FFFFFF"
                          android:textColorHint="#888888" />
                  </LinearLayout>

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnSaveTimer"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="Save Timer &amp; Update Widget"
                      android:textAllCaps="false"
                      android:backgroundTint="#4DB6AC" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="24dp"
                      android:text="Widget Appearance &amp; Scaling"
                      android:textColor="#80CBC4"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <Spinner
                      android:id="@+id/spinnerScaling"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginTop="8dp"
                      android:background="#1E1E1E"
                      android:padding="10dp" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="24dp"
                      android:text="Set Wallpapers"
                      android:textColor="#80CBC4"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnSetPhotoWallpaper"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="Set Photo Live Wallpaper"
                      android:textAllCaps="false" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnSetVideoWallpaper"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="Set Video Live Wallpaper"
                      android:textAllCaps="false" />

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:text="Ready"
                      android:textColor="#80CBC4"
                      android:textSize="13sp" />
              </LinearLayout>
          </ScrollView>
          EOF

          # ========== layout/widget_photo.xml ==========
          cat > "$APP/src/main/res/layout/widget_photo.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widgetRoot"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg">

              <ImageView
                  android:id="@+id/widgetImage"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="centerCrop"
                  android:contentDescription="Photo" />

              <TextView
                  android:id="@+id/widgetEmpty"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:text="Add Photos"
                  android:textColor="#888888"
                  android:textSize="14sp" />
          </FrameLayout>
          EOF

          # ========== drawable/widget_bg.xml ==========
          cat > "$APP/src/main/res/drawable/widget_bg.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#1E1E1E" />
              <corners android:radius="16dp" />
              <stroke android:width="2dp" android:color="#4DB6AC" />
          </shape>
          EOF

          # ========== values/strings.xml ==========
          cat > "$APP/src/main/res/values/strings.xml" << 'EOF'
          <resources>
              <string name="app_name">PhotoFlow Wallpaper</string>
              <string name="wallpaper_desc">Photo Flow Live Wallpaper</string>
              <string name="wallpaper_video_desc">Video Live Wallpaper</string>
          </resources>
          EOF

          # ========== values/themes.xml ==========
          cat > "$APP/src/main/res/values/themes.xml" << 'EOF'
          <resources>
              <style name="Theme.PhotoFlow" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#80CBC4</item>
                  <item name="colorPrimaryVariant">#4DB6AC</item>
                  <item name="colorOnPrimary">#000000</item>
                  <item name="android:statusBarColor">#121212</item>
                  <item name="android:navigationBarColor">#121212</item>
                  <item name="android:windowBackground">#121212</item>
              </style>
          </resources>
          EOF

          # ========== drawable/ic_launcher_foreground.xml ==========
          cat > "$APP/src/main/res/drawable/ic_launcher_foreground.xml" << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#80CBC4"
                  android:pathData="M54,30 C40,30 30,40 30,54 C30,68 40,78 54,78 C68,78 78,68 78,54 C78,40 68,30 54,30 Z M54,44 C59.5,44 64,48.5 64,54 C64,59.5 59.5,64 54,64 C48.5,64 44,59.5 44,54 C44,48.5 48.5,44 54,44 Z" />
          </vector>
          EOF

          # ========== mipmap-anydpi-v26/ic_launcher.xml ==========
          cat > "$APP/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # ========== values/colors.xml ==========
          cat > "$APP/src/main/res/values/colors.xml" << 'EOF'
          <resources>
              <color name="ic_launcher_background">#121212</color>
          </resources>
          EOF

          # ========== MainActivity.kt ==========
          cat > "$APP/src/main/java/com/photoflow/wallpaper/MainActivity.kt" << 'EOF'
          package com.photoflow.wallpaper

          import android.app.Activity
          import android.app.WallpaperManager
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.button.MaterialButton

          class MainActivity : AppCompatActivity() {

              private lateinit var tvStatus: TextView
              private lateinit var spinnerInterval: Spinner
              private lateinit var spinnerScaling: Spinner
              private lateinit var customTimeLayout: LinearLayout
              private lateinit var etHours: EditText
              private lateinit var etMinutes: EditText
              private lateinit var etSeconds: EditText

              private val intervals = listOf(
                  "5 sec", "10 sec", "15 sec", "30 sec", "45 sec",
                  "1 min", "2 min", "3 min", "5 min", "10 min",
                  "15 min", "30 min", "1 hour", "Custom"
              )
              private val intervalValues = listOf(
                  5000L, 10000L, 15000L, 30000L, 45000L,
                  60000L, 120000L, 180000L, 300000L, 600000L,
                  900000L, 1800000L, 3600000L, -1L
              )
              private val scalingModes = listOf("Center Crop", "Fit Center", "Fill / Stretch")
              private val scalingValues = listOf("centerCrop", "fitCenter", "fitXY")

              private val pickPhotos = registerForActivityResult(
                  ActivityResultContracts.OpenMultipleDocuments()
              ) { uris: List<Uri> ->
                  if (uris.isNotEmpty()) {
                      val takeFlags = Intent.FLAG_GRANT_READ_URI_PERMISSION
                      uris.forEach { uri ->
                          contentResolver.takePersistableUriPermission(uri, takeFlags)
                      }
                      val prefs = getSharedPreferences("photoflow", MODE_PRIVATE)
                      val existing = prefs.getStringSet("photo_uris", emptySet()) ?: emptySet()
                      val merged = existing + uris.map { it.toString() }
                      prefs.edit().putStringSet("photo_uris", merged).apply()
                      tvStatus.text = "Selected photos: ${merged.size}"
                      Toast.makeText(this, "${uris.size} photos added", Toast.LENGTH_SHORT).show()
                      triggerWidgetUpdate()
                  }
              }

              private val pickVideo = registerForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri: Uri? ->
                  uri?.let {
                      contentResolver.takePersistableUriPermission(it, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      val prefs = getSharedPreferences("photoflow", MODE_PRIVATE)
                      prefs.edit().putString("video_uri", it.toString()).apply()
                      tvStatus.text = "Video selected"
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  tvStatus = findViewById(R.id.tvStatus)
                  spinnerInterval = findViewById(R.id.spinnerInterval)
                  spinnerScaling = findViewById(R.id.spinnerScaling)
                  customTimeLayout = findViewById(R.id.customTimeLayout)
                  etHours = findViewById(R.id.etHours)
                  etMinutes = findViewById(R.id.etMinutes)
                  etSeconds = findViewById(R.id.etSeconds)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 101)
                  }

                  setupSpinners()
                  loadSavedSettings()

                  findViewById<MaterialButton>(R.id.btnPickPhotos).setOnClickListener {
                      pickPhotos.launch(arrayOf("image/*"))
                  }

                  findViewById<MaterialButton>(R.id.btnPickVideo).setOnClickListener {
                      pickVideo.launch(arrayOf("video/*"))
                  }

                  findViewById<MaterialButton>(R.id.btnSaveTimer).setOnClickListener {
                      saveTimerSettings()
                  }

                  findViewById<MaterialButton>(R.id.btnSetPhotoWallpaper).setOnClickListener {
                      setLiveWallpaper(PhotoLiveWallpaperService::class.java)
                  }

                  findViewById<MaterialButton>(R.id.btnSetVideoWallpaper).setOnClickListener {
                      setLiveWallpaper(VideoLiveWallpaperService::class.java)
                  }
              }

              private fun setupSpinners() {
                  val intervalAdapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, intervals)
                  spinnerInterval.adapter = intervalAdapter
                  spinnerInterval.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          customTimeLayout.visibility = if (intervals[position] == "Custom") View.VISIBLE else View.GONE
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  val scalingAdapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, scalingModes)
                  spinnerScaling.adapter = scalingAdapter
                  spinnerScaling.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          val prefs = getSharedPreferences("photoflow", MODE_PRIVATE)
                          prefs.edit().putString("image_scaling", scalingValues[position]).apply()
                          triggerWidgetUpdate()
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
              }

              private fun loadSavedSettings() {
                  val prefs = getSharedPreferences("photoflow", MODE_PRIVATE)
                  val savedInterval = prefs.getLong("widget_interval", 30000L)
                  val savedScaling = prefs.getString("image_scaling", "centerCrop")

                  val intervalIdx = intervalValues.indexOf(savedInterval)
                  if (intervalIdx >= 0) {
                      spinnerInterval.setSelection(intervalIdx)
                  } else {
                      spinnerInterval.setSelection(intervals.size - 1) // Custom
                      val hrs = savedInterval / 3600000
                      val mins = (savedInterval % 3600000) / 60000
                      val secs = (savedInterval % 60000) / 1000
                      if (hrs > 0) etHours.setText(hrs.toString())
                      if (mins > 0) etMinutes.setText(mins.toString())
                      if (secs > 0) etSeconds.setText(secs.toString())
                  }

                  val scalingIdx = scalingValues.indexOf(savedScaling)
                  if (scalingIdx >= 0) spinnerScaling.setSelection(scalingIdx)

                  val count = prefs.getStringSet("photo_uris", emptySet())?.size ?: 0
                  tvStatus.text = "Saved photos: $count"
              }

              private fun saveTimerSettings() {
                  val selectedPos = spinnerInterval.selectedItemPosition
                  var finalInterval = intervalValues[selectedPos]

                  if (finalInterval == -1L) {
                      val hrs = etHours.text.toString().toLongOrNull() ?: 0L
                      val mins = etMinutes.text.toString().toLongOrNull() ?: 0L
                      val secs = etSeconds.text.toString().toLongOrNull() ?: 0L
                      finalInterval = (hrs * 3600000) + (mins * 60000) + (secs * 1000)
                  }

                  if (finalInterval <= 0L) {
                      Toast.makeText(this, "Invalid interval. Must be greater than 0.", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val prefs = getSharedPreferences("photoflow", MODE_PRIVATE)
                  prefs.edit().putLong("widget_interval", finalInterval).apply()
                  
                  Toast.makeText(this, "Timer saved: ${finalInterval / 1000} seconds", Toast.LENGTH_SHORT).show()
                  triggerWidgetUpdate()
              }

              private fun triggerWidgetUpdate() {
                  val intent = Intent(this, PhotoWidgetProvider::class.java).apply {
                      action = AppWidgetManager.ACTION_APPWIDGET_UPDATE
                  }
                  val ids = AppWidgetManager.getInstance(this).getAppWidgetIds(
                      ComponentName(this, PhotoWidgetProvider::class.java)
                  )
                  intent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, ids)
                  sendBroadcast(intent)
              }

              private fun setLiveWallpaper(serviceClass: Class<*>) {
                  val intent = Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER)
                  intent.putExtra(
                      WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,
                      ComponentName(this, serviceClass)
                  )
                  startActivity(intent)
              }
          }
          EOF

          # ========== PhotoWidgetProvider.kt ==========
          cat > "$APP/src/main/java/com/photoflow/wallpaper/PhotoWidgetProvider.kt" << 'EOF'
          package com.photoflow.wallpaper

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.widget.RemoteViews
          import java.io.InputStream

          class PhotoWidgetProvider : AppWidgetProvider() {

              companion object {
                  const val ACTION_NEXT_IMAGE = "com.photoflow.wallpaper.ACTION_NEXT_IMAGE"
                  const val ALARM_REQUEST_CODE = 1001
              }

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  for (appWidgetId in appWidgetIds) {
                      updateWidget(context, appWidgetManager, appWidgetId, false)
                  }
                  scheduleAlarm(context)
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  if (intent.action == ACTION_NEXT_IMAGE) {
                      val appWidgetManager = AppWidgetManager.getInstance(context)
                      val ids = appWidgetManager.getAppWidgetIds(
                          ComponentName(context, PhotoWidgetProvider::class.java)
                      )
                      for (id in ids) {
                          updateWidget(context, appWidgetManager, id, true)
                      }
                      scheduleAlarm(context)
                  }
              }

              override fun onDeleted(context: Context, appWidgetIds: IntArray) {
                  super.onDeleted(context, appWidgetIds)
                  val prefs = context.getSharedPreferences("photoflow", MODE_PRIVATE)
                  val editor = prefs.edit()
                  for (id in appWidgetIds) {
                      editor.remove("widget_index_$id")
                  }
                  editor.apply()
              }

              override fun onDisabled(context: Context) {
                  super.onDisabled(context)
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(context, PhotoWidgetProvider::class.java).apply {
                      action = ACTION_NEXT_IMAGE
                  }
                  val pendingIntent = PendingIntent.getBroadcast(
                      context, ALARM_REQUEST_CODE, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  alarmManager.cancel(pendingIntent)
              }

              private fun updateWidget(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetId: Int,
                  advanceImage: Boolean
              ) {
                  val prefs = context.getSharedPreferences("photoflow", MODE_PRIVATE)
                  val uris = prefs.getStringSet("photo_uris", emptySet())?.toList() ?: emptyList()
                  val scaling = prefs.getString("image_scaling", "centerCrop") ?: "centerCrop"

                  val views = RemoteViews(context.packageName, R.layout.widget_photo)
                  
                  val scaleType = when (scaling) {
                      "fitCenter" -> android.widget.ImageView.ScaleType.FIT_CENTER
                      "fitXY" -> android.widget.ImageView.ScaleType.FIT_XY
                      else -> android.widget.ImageView.ScaleType.CENTER_CROP
                  }
                  views.setInt(R.id.widgetImage, "setScaleType", scaleType.ordinal)

                  if (uris.isNotEmpty()) {
                      var index = prefs.getInt("widget_index_$appWidgetId", 0)
                      if (advanceImage) index = (index + 1) % uris.size
                      
                      val uri = Uri.parse(uris[index])
                      try {
                          val input: InputStream? = context.contentResolver.openInputStream(uri)
                          val bitmap = BitmapFactory.decodeStream(input)
                          input?.close()
                          if (bitmap != null) {
                              views.setImageViewBitmap(R.id.widgetImage, bitmap)
                              views.setViewVisibility(R.id.widgetEmpty, android.view.View.GONE)
                              prefs.edit().putInt("widget_index_$appWidgetId", index).apply()
                          } else {
                              views.setViewVisibility(R.id.widgetEmpty, android.view.View.VISIBLE)
                          }
                      } catch (e: Exception) {
                          views.setViewVisibility(R.id.widgetEmpty, android.view.View.VISIBLE)
                      }
                  } else {
                      views.setViewVisibility(R.id.widgetEmpty, android.view.View.VISIBLE)
                      views.setViewVisibility(R.id.widgetImage, android.view.View.GONE)
                  }
                  appWidgetManager.updateAppWidget(appWidgetId, views)
              }

              private fun scheduleAlarm(context: Context) {
                  val prefs = context.getSharedPreferences("photoflow", MODE_PRIVATE)
                  val interval = prefs.getLong("widget_interval", 30000L)
                  
                  // Minimum realistic interval for alarms is often 15s-30s to prevent abuse/battery drain
                  val safeInterval = if (interval < 15000L) 15000L else interval

                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(context, PhotoWidgetProvider::class.java).apply {
                      action = ACTION_NEXT_IMAGE
                  }
                  val pendingIntent = PendingIntent.getBroadcast(
                      context, ALARM_REQUEST_CODE, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val triggerTime = System.currentTimeMillis() + safeInterval

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      if (alarmManager.canScheduleExactAlarms()) {
                          alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerTime, pendingIntent)
                      } else {
                          alarmManager.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerTime, pendingIntent)
                      }
                  } else {
                      alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerTime, pendingIntent)
                  }
              }
          }
          EOF

          # ========== PhotoLiveWallpaperService.kt ==========
          cat > "$APP/src/main/java/com/photoflow/wallpaper/PhotoLiveWallpaperService.kt" << 'EOF'
          package com.photoflow.wallpaper

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Rect
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.service.wallpaper.WallpaperService
          import android.view.SurfaceHolder

          class PhotoLiveWallpaperService : WallpaperService() {

              override fun onCreateEngine(): Engine = PhotoEngine()

              inner class PhotoEngine : Engine() {
                  private val handler = Handler(Looper.getMainLooper())
                  private var visible = false
                  private var currentIndex = 0
                  private var currentBitmap: Bitmap? = null
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG)

                  private val runnable = object : Runnable {
                      override fun run() {
                          if (!visible) return
                          loadNext()
                          val interval = getSharedPreferences("photoflow", MODE_PRIVATE).getLong("widget_interval", 30000L)
                          handler.postDelayed(this, interval)
                      }
                  }

                  override fun onVisibilityChanged(visible: Boolean) {
                      this.visible = visible
                      if (visible) {
                          loadNext()
                          val interval = getSharedPreferences("photoflow", MODE_PRIVATE).getLong("widget_interval", 30000L)
                          handler.postDelayed(runnable, interval)
                      } else {
                          handler.removeCallbacks(runnable)
                      }
                  }

                  override fun onSurfaceDestroyed(holder: SurfaceHolder) {
                      super.onSurfaceDestroyed(holder)
                      handler.removeCallbacks(runnable)
                      currentBitmap?.recycle()
                      currentBitmap = null
                  }

                  private fun loadNext() {
                      val prefs = getSharedPreferences("photoflow", MODE_PRIVATE)
                      val uris = prefs.getStringSet("photo_uris", emptySet())?.toList() ?: return
                      if (uris.isEmpty()) {
                          drawPlaceholder()
                          return
                      }
                      currentIndex = (currentIndex + 1) % uris.size
                      val uri = Uri.parse(uris[currentIndex])
                      try {
                          val input = contentResolver.openInputStream(uri)
                          val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          BitmapFactory.decodeStream(input, null, options)
                          input?.close()
                          options.inSampleSize = calculateSampleSize(options)
                          options.inJustDecodeBounds = false
                          val input2 = contentResolver.openInputStream(uri)
                          val bitmap = BitmapFactory.decodeStream(input2, null, options)
                          input2?.close()
                          currentBitmap?.recycle()
                          currentBitmap = bitmap
                          draw()
                      } catch (e: Exception) {
                          drawPlaceholder()
                      }
                  }

                  private fun calculateSampleSize(options: BitmapFactory.Options): Int {
                      val maxDim = 2048
                      var sample = 1
                      while (options.outWidth / sample > maxDim || options.outHeight / sample > maxDim) {
                          sample *= 2
                      }
                      return sample
                  }

                  private fun draw() {
                      val holder = surfaceHolder
                      var canvas: Canvas? = null
                      try {
                          canvas = holder.lockCanvas()
                          canvas?.drawColor(Color.BLACK)
                          currentBitmap?.let { bmp ->
                              val rect = Rect(0, 0, canvas!!.width, canvas!!.height)
                              canvas.drawBitmap(bmp, null, rect, paint)
                          }
                      } finally {
                          canvas?.let { holder.unlockCanvasAndPost(it) }
                      }
                  }

                  private fun drawPlaceholder() {
                      val holder = surfaceHolder
                      var canvas: Canvas? = null
                      try {
                          canvas = holder.lockCanvas()
                          canvas?.drawColor(Color.parseColor("#1E1E1E"))
                      } finally {
                          canvas?.let { holder.unlockCanvasAndPost(it) }
                      }
                  }
              }
          }
          EOF

          # ========== VideoLiveWallpaperService.kt ==========
          cat > "$APP/src/main/java/com/photoflow/wallpaper/VideoLiveWallpaperService.kt" << 'EOF'
          package com.photoflow.wallpaper

          import android.net.Uri
          import android.service.wallpaper.WallpaperService
          import android.view.SurfaceHolder
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer

          class VideoLiveWallpaperService : WallpaperService() {

              override fun onCreateEngine(): Engine = VideoEngine()

              inner class VideoEngine : Engine() {
                  private var player: ExoPlayer? = null

                  override fun onSurfaceCreated(holder: SurfaceHolder) {
                      super.onSurfaceCreated(holder)
                      player = ExoPlayer.Builder(this@VideoLiveWallpaperService).build().apply {
                          val prefs = getSharedPreferences("photoflow", MODE_PRIVATE)
                          val videoUri = prefs.getString("video_uri", null)
                          if (videoUri != null) {
                              setMediaItem(MediaItem.fromUri(Uri.parse(videoUri)))
                              repeatMode = Player.REPEAT_MODE_ONE
                              volume = if (prefs.getBoolean("video_sound", false)) 1f else 0f
                              prepare()
                          }
                          setVideoSurfaceHolder(holder)
                      }
                  }

                  override fun onVisibilityChanged(visible: Boolean) {
                      if (visible) {
                          player?.playWhenReady = true
                      } else {
                          player?.playWhenReady = false
                      }
                  }

                  override fun onSurfaceDestroyed(holder: SurfaceHolder) {
                      super.onSurfaceDestroyed(holder)
                      player?.release()
                      player = null
                  }
              }
          }
